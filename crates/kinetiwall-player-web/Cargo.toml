[package]
name = "kinetiwall-player-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "KinetiWall isolated interactive web wallpaper player host (WebView2) and controller-side PlayerAdapter."

[features]
default = []
# Test-only deterministic backend.
fake-backend = []

[dependencies]
kinetiwall-audio = { path = "../kinetiwall-audio" }
kinetiwall-catalog = { path = "../kinetiwall-catalog" }
kinetiwall-playback = { path = "../kinetiwall-playback" }
libloading.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
kinetiwall-player-web = { path = ".", features = ["fake-backend"] }

[[bin]]
name = "kinetiwall-player-web"
path = "src/bin/kinetiwall-player-web.rs"

